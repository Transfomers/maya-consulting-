
services:
  backend:
    build:
      context: ./backend
    container_name: cap_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/capentrepreneurs.db
      FRONTEND_URL: https://capentrepreneurs.org
      SECRET_KEY: ${SECRET_KEY}
      CRAFTI_API_KEY: ${CRAFTI_API_KEY}
      CRAFTI_API_BASE: ${CRAFTI_API_BASE:-https://rag-platform-backend-qt2l.onrender.com}
    volumes:
      - ./backend/data:/app/data
    expose:
      - "8000"
    networks:
      - cap_network

  frontend:
    build:
      context: ./frontend
    container_name: cap_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.cap.rule=Host(`capentrepreneurs.org`) || Host(`www.capentrepreneurs.org`)"
      - "traefik.http.routers.cap.entrypoints=websecure"
      - "traefik.http.routers.cap.tls=true"
      - "traefik.http.routers.cap.tls.certresolver=letsencrypt"
      - "traefik.http.services.cap.loadbalancer.server.port=80"
    networks:
      - cap_network
      - proxy

networks:
  cap_network:
    name: capentrepreneurs_default

  proxy:
    external: true
