
services:
  backend:
    build:
      context: ./backend
    container_name: m3_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/3mservice.db
      FRONTEND_URL: https://3mservice.shop
      SECRET_KEY: ${SECRET_KEY}
      CRAFTI_API_KEY: ${CRAFTI_API_KEY}
      CRAFTI_API_BASE: ${CRAFTI_API_BASE:-https://rag-platform-backend-qt2l.onrender.com}
    volumes:
      - ./backend/data:/app/data
    expose:
      - "8000"
    networks:
      - m3_network

  frontend:
    build:
      context: ./frontend
    container_name: m3_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.m3service.rule=Host(`3mservice.shop`) || Host(`www.3mservice.shop`)"
      - "traefik.http.routers.m3service.entrypoints=web,websecure"
      - "traefik.http.routers.m3service.tls=true"
      - "traefik.http.routers.m3service.tls.certresolver=letsencrypt"
      - "traefik.http.routers.m3service.service=m3service"
      - "traefik.http.services.m3service.loadbalancer.server.port=80"
    networks:
      - m3_network
      - proxy

networks:
  m3_network:
    name: 3mservice_default

  proxy:
    external: true
