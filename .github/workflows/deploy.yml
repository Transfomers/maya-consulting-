name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main ] # Change to 'master' if your default branch is master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up SSH and Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        script: |
          # The directory where the repository is cloned on your VPS
          PROJECT_DIR="/var/www/capentrepreneurs"
          
          # Navigate to your project directory on the VPS
          cd $PROJECT_DIR || { echo "Directory not found! Please clone the repo first."; exit 1; }
          
          # Pull the latest code from GitHub
          git fetch origin main
          git reset --hard origin/main

          # Rebuild and restart the Docker containers using Docker Compose
          # This will spin up the backend, frontend, and traefik services defined in docker-compose.yml
          docker compose up -d --build
