name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:

      - name: Check SSH secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "❌ VPS_HOST is missing"
            exit 1
          fi

          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "❌ VPS_USER is missing"
            exit 1
          fi

          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ VPS_SSH_KEY is missing"
            exit 1
          fi

          if [ -z "${{ secrets.VPS_PORT }}" ]; then
            echo "❌ VPS_PORT is missing"
            exit 1
          fi

          echo "✅ VPS_HOST is configured"
          echo "✅ VPS_USER is configured"
          echo "✅ VPS_SSH_KEY is configured"
          echo "✅ VPS_PORT is configured"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 30s
          command_timeout: 10m
          debug: true

          script: |
            set -e

            echo "Connected successfully!"
            whoami
            hostname
            pwd

            echo "======================================"
            echo "SSH CONNECTION SUCCESSFUL"
            echo "======================================"

            # Fix git safe.directory if needed
            git config --global --add safe.directory /var/www/capentrepreneurs || true

            cd /var/www/capentrepreneurs

            echo "Current directory:"
            pwd

            echo "Updating repository..."

            git fetch origin
            git reset --hard origin/main

            echo "Repository updated."

            echo "Stopping/rebuilding Docker containers..."

            docker compose up -d --build

            echo "Running database migrations..."
            docker exec cap_backend alembic upgrade head || echo "Warning: Migrations failed or already up to date"

            echo "Seeding admin accounts..."
            docker exec cap_backend python seed_admin.py

            echo "Checking containers..."

            docker compose ps

            echo "======================================"
            echo "DEPLOYMENT COMPLETED"
            echo "======================================"
