name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: capentrepreneurs-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 30s
          command_timeout: 20m
          script_stop: true

          script: |
            set -e

            echo "======================================"
            echo "CAP Entrepreneurs Deployment"
            echo "======================================"

            cd /var/www/capentrepreneurs

            echo ""
            echo "1. Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo ""
            echo "2. Current commit:"
            git log -1 --oneline

            echo ""
            echo "3. Validating Docker Compose..."
            docker compose config -q

            echo ""
            echo "4. Building and starting containers..."
            docker compose up -d --build

            echo ""
            echo "5. Container status..."
            docker compose ps

            echo ""
            echo "6. Waiting for Traefik routing to update..."
            sleep 15
            
            echo "7. Testing website..."
            curl --fail --silent --show-error --head \
              --max-time 30 \
              https://capentrepreneurs.org

            echo ""
            echo "======================================"
            echo "Deployment completed successfully!"
            echo "======================================"
