name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check SSH configuration
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "❌ SSH_HOST is missing"
            exit 1
          fi

          if [ -z "${{ secrets.SSH_USERNAME }}" ]; then
            echo "❌ SSH_USERNAME is missing"
            exit 1
          fi

          if [ -z "${{ secrets.SSH_PASSWORD }}" ]; then
            echo "❌ SSH_PASSWORD is missing"
            exit 1
          fi

          echo "✅ SSH configuration found"

      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 20m

          script: |
            set -e

            echo "🚀 Starting CAP Entrepreneurs deployment..."

            cd /var/www/capentrepreneurs

            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 Rebuilding Docker containers..."
            docker compose up -d --build

            echo "🧹 Cleaning unused Docker images..."
            docker image prune -f

            echo "📊 Current containers:"
            docker compose ps

            echo "✅ Deployment completed successfully!"
