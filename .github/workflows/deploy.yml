name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: |
            set -Eeuo pipefail

            echo "======================================"
            echo "CAP ENTREPRENEURS DEPLOYMENT"
            echo "======================================"

            APP_DIR="/var/www/capentrepreneurs"

            echo ""
            echo "1. Checking server..."
            echo "Server: $(hostname)"
            echo "User: $(whoami)"
            docker --version
            docker compose version

            echo ""
            echo "2. Entering application directory..."
            cd "$APP_DIR"
            pwd

            echo ""
            echo "3. Checking Git repository..."
            git status
            git remote -v

            echo ""
            echo "4. Fetching latest code..."
            git fetch --prune origin main

            echo ""
            echo "5. Resetting production server to origin/main..."
            git reset --hard origin/main

            echo ""
            echo "6. Current commit..."
            git log -1 --oneline

            echo ""
            echo "7. Validating Docker Compose..."
            docker compose config

            echo ""
            echo "8. Building and starting containers..."
            docker compose up -d --build

            echo ""
            echo "9. Waiting for containers..."
            sleep 10

            echo ""
            echo "10. Container status..."
            docker compose ps

            echo ""
            echo "11. Container health..."
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "12. Recent application logs..."
            docker compose logs --tail=100 || true

            echo ""
            echo "13. Testing containers..."
            docker compose ps --status running

            echo ""
            echo "======================================"
            echo "DEPLOYMENT COMPLETED"
            echo "======================================"
