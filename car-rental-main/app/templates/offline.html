<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors Ligne - 3M SERVICES</title>
    <style>
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #C92A2A; }
        p { margin-bottom: 20px; color: #666; }
        .btn {
            background-color: #C92A2A;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover { background-color: #5a172b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📵 Hors Ligne</h1>
        <p>Il semble que vous n'ayez plus de connexion internet. L'application 3M SERVICES a besoin d'être connectée pour effectuer des réservations.</p>
        <button onclick="window.location.reload()" class="btn">Réessayer</button>
    </div>
</body>
</html>
