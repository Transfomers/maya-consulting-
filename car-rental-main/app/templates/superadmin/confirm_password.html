{% extends "superadmin/_layout.html" %}
{% block title %}Confirmer votre identité{% endblock %}
{% block content %}
<div class="sa-auth">
    <div class="sa-card sa-auth__card">
        <div class="sa-auth__icon"><i class="bi bi-shield-lock"></i></div>
        <h1 class="sa-title justify-content-center">Confirmez votre identité</h1>
        <p class="sa-sub text-center mb-3">Action sensible : saisissez votre mot de passe. La confirmation reste valable 10 minutes.</p>
        {% if error %}<div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>{% endif %}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ next }}">
            <label class="form-label small fw-semibold" for="pw">Mot de passe</label>
            <input id="pw" type="password" name="password" class="form-control mb-3" required autofocus autocomplete="current-password">
            <button class="btn btn-brand w-100">Confirmer</button>
        </form>
    </div>
</div>
{% endblock %}
