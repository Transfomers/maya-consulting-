      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="halo-marc" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
